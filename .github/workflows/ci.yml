name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tsc, lint y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

  web:
    name: App en la web (humo, 5 idiomas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Con API para que se pinten también las pantallas de la cuenta (no hace falta que responda).
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:9
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run smoke

  backend:
    name: Backend (lint, tests y e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lumi:lumi@localhost:5432/lumi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # El lockfile es de npm 11 (npm 10 no resuelve este árbol).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      # El cliente de la app se genera de este archivo: si cambia la API sin regenerarlo, falla.
      - name: openapi.json al día
        run: npm run openapi && git diff --exit-code openapi.json

  docs:
    name: Ficha y legales (límites y páginas generadas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Los límites de caracteres de Apple en las fichas de los 5 idiomas.
      - run: python3 tools/check_ficha.py
      # Las páginas legales de la landing se generan de los textos de la app: tienen que estar al día.
      - name: Páginas legales al día
        run: python3 landing/tools/legal.py && git diff --exit-code landing
