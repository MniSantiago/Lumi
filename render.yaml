# Blueprint de Render: https://render.com/docs/blueprint-spec
# Crea la base de datos, la API y la landing de una vez (New > Blueprint > este repo).
# Después: RESEND_API_KEY y MAIL_FROM en la API, y el dominio en CORS_ORIGINS.

databases:
  - name: lumi-db
    databaseName: lumi
    user: lumi
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: lumi-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: lumi-landing
    runtime: static
    rootDir: landing
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
