<!doctype html>
<!-- Chrome headless no baja de 500 px de ancho: esto mete la landing en un iframe del tamaño pedido (?w=390&h=844). -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#13112E}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.width = p.get('w') || 390;
  f.height = p.get('h') || 844;
  f.src = '../index.html' + (p.get('q') ? '?' + p.get('q') : '');
</script>
