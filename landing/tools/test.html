<!doctype html>
<!-- Prueba rápida de interacción. Abrir con Chrome y --allow-file-access-from-files (ver tools/test.sh). -->
<meta charset="utf-8">
<style>html,body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f" width="390" height="844" src="../index.html?utm_source=tiktok&utm_campaign=escudo"></iframe>
<script>
  const f = document.getElementById('f');
  const log = [];
  f.onload = async () => {
    const w = f.contentWindow, d = f.contentDocument;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    try {
      // 1. Correo inválido
      const form = d.querySelector('form[data-form="hero"]');
      form.elements.email.value = 'hola';
      form.requestSubmit();
      await wait(50);
      log.push('invalid:' + form.querySelector('.form-msg').textContent);
      // 2. Correo válido sin endpoint
      form.elements.email.value = 'hola@lumi.app';
      form.requestSubmit();
      await wait(50);
      log.push('noendpoint:' + form.querySelector('.form-msg').textContent);
      // 3. Estados
      d.querySelector('[data-state="apagadita"]').click();
      log.push('state:' + d.querySelector('.phone[data-lit]').dataset.lit + ' ' + d.querySelector('[data-bubble]').textContent);
      // 4. Escudo
      d.querySelector('[data-shield-choice="snooze"]').click();
      log.push('shield:' + d.querySelector('[data-shield-reply]').textContent);
      // 5. Origen
      log.push('source:' + w.sessionStorage.getItem('lumi-source'));
      // 6. Estado de éxito (simulado con fetch falso)
      w.fetch = async () => ({ ok: true, status: 200 });
      log.push('ok');
    } catch (e) { log.push('ERR ' + e.message); }
    document.title = 'DONE';
    const pre = document.createElement('pre'); pre.id = 'log'; pre.textContent = log.join('\n'); document.body.appendChild(pre);
  };
</script>
